services:
  - type: web
    name: mimichan-chat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSCODE
        sync: false
      - key: SECRET_KEY
        generateValue: true
